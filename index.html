<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spread Positivity</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☺</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background">
    <h1 class="header">Spread Positivity</h1>
    <p class="hearts">♡ ♡ ♡</p>
    <p class="message">Happiness is a mindset.</p>
    <button class="add-message-btn">Add Your Own Message</button>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <h2 class="modal-title">Share a Positive Message</h2>
      <textarea class="modal-input" id="message-input" placeholder="Type your message..." maxlength="280"></textarea>
      <button class="modal-submit" id="modal-submit">Submit</button>
      <p class="modal-confirmation" id="modal-confirmation">Message saved! Thank you for spreading positivity.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
